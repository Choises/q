<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Live Chat</title>
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%; background: transparent; 
            font-family: Arial, sans-serif; color: #e0e0e0; overflow: hidden;
        }
               /* 📱 ΤΟ ΚΟΥΤΙ ΤΟΥ ΚΙΝΗΤΟΥ: Όρθιο layout που προσαρμόζεται στο ύψος (vh) */
        #chat-container {
            display: flex; 
            flex-direction: column; 
            height: 100vh; /* Γεμίζει ακριβώς το ύψος του διαθέσιμου χώρου */
            width: 100%; 
            max-width: 360px; /* Κλειδώνει το πλάτος σαν όρθιο smartphone */
            background: transparent; /* Το εσωτερικό dark φόντο του chat */
            box-sizing: border-box; 
            padding: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin: 0 auto; /* Κεντράρει το όρθιο chat στην οθόνη του υπολογιστή */
        }

                        #chat-messages {
            flex: 1; 
            background: transparent; /* Τελείως διάφανο φόντο μηνυμάτων */
            overflow-y: auto; 
            padding: 10px; 
            font-size: 16px; /* Το μέγεθος που επιλέξατε */
            font-weight: bold; /* 🔥 ΚΛΕΙΔΙ: Εδώ κάνουμε όλα τα γράμματα BOLD (Έντονα)! */
            border-bottom: 1px solid #333;
        }


        #input-area {
            padding: 8px 0; display: flex; flex-direction: column; gap: 6px; background: #121212;
        }
        .input-row { display: flex; gap: 5px; align-items: center; }
        input[type="text"] { padding: 8px; border: 1px solid #444; border-radius: 4px; background: #2c2c2c; color: #fff; font-size: 14px; }
        button { border: none; border-radius: 4px; cursor: pointer; font-weight: bold; height: 35px; }
    </style>
</head>
<body>

<div id="chat-container">
    <!-- 📌 ΤΟ ΚΟΥΤΙ ΤΩΝ ΜΗΝΥΜΑΤΩΝ ΠΑΙΡΝΕΙ ΤΗ ΣΩΣΤΗ ΣΕΙΡΑ -->
        <div id="chat-messages">
        <!-- 📊 ΜΟΝΟ Ο ΜΕΤΡΗΤΗΣ ΜΕΝΕΙ ΣΤΑΘΕΡΟΣ ΣΤΗΝ ΚΟΡΥΦΗ -->
        <div style="display: flex; justify-content: flex-end; align-items: center; padding: 5px 10px; margin-bottom: 12px; position: sticky; top: 0; background: transparent; z-index: 10;">
            <div id="user-counter" style="color: #00ffcc; font-weight: bold; font-size: 13px; text-shadow: 0 0 5px #00ffcc;">Online: 1</div>
        </div>
            
        <!-- 🟢 ΤΟ ΜΗΝΥΜΑ ΣΥΝΔΕΣΗΣ: Τώρα θα ανεβαίνει κανονικά προς τα πάνω μαζί με τα μηνύματα! -->
        <div id="connection-status" style="color: #aaa; text-align: center; font-style: italic; font-size: 13px; margin-bottom: 15px;">Σύνδεση...</div>

</div>
    
    <div id="input-area">
        <input type="text" id="chat-username" placeholder="Το όνομά σας..." style="width: 100%; box-sizing: border-box;" />
        <div class="input-row">
            <button id="voice-btn" style="background: #c0392b; color: white; width: 40px;" disabled>🎙️</button>
            <input type="text" id="chat-message" placeholder="Γράψτε μήνυμα..." disabled style="flex: 1;" />
            <button id="chat-send" style="background: #2980b9; color: white; padding: 0 15px;" disabled>Αποστολή</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
<script>
    const socket = io('https://panagiotis-live-chat.onrender.com/');
    const soundSend = new Audio('https://www.myinstants.com/media/sounds/magic-fairy.mp3'); 
    const soundReceive = new Audio('https://www.myinstants.com/media/sounds/ding-sound-effect_2.mp3'); 
    const soundJoin = new Audio('https://www.myinstants.com/media/sounds/xat-notification-sound.mp3'); 
 
    const urlParams = new URLSearchParams(window.location.search);
    const isAdmin = urlParams.get('admin') === 'true';
    const myUserId = 'user_' + Math.random().toString(36).substr(2, 9);

    const colors = ['#00ffcc', '#00ff66', '#ffff00', '#ff007f', '#ff9900', '#cc00ff', '#33ccff', '#ff3333', '#1abc9c'];
    const userColor = colors[Math.floor(Math.random() * colors.length)];

    const messagesContainer = document.getElementById('chat-messages');
    const statusContainer = document.getElementById('connection-status');
    const usernameInput = document.getElementById('chat-username');
    const messageInput = document.getElementById('chat-message');
    const sendButton = document.getElementById('chat-send');
    const voiceButton = document.getElementById('voice-btn');

    let mediaRecorder = null; let audioChunks = []; let mediaStream = null;

    // Η «μαγική» συνάρτηση linkify (Απλή, πανίσχυρη και σε ασφαλή μορφή)
    function linkify(text) {
        const urlPattern = /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig;
        return text.replace(urlPattern, function(url) {
            const u = url.toLowerCase();
            if (u.includes('.jpg') || u.includes('.jpeg') || u.includes('.png') || u.includes('.gif') || u.includes('.webp')) {
                return `<img src="${url}" style="max-width: 100%; max-height: 150px; border-radius: 8px; display: block; margin-top: 5px; border: 1px solid #333; cursor: pointer;" onclick="window.open('${url}', '_blank')" alt="Εικόνα Chat" />`;
            } else {
                return `<a href="${url}" target="_blank" style="color: #00ffcc; text-decoration: underline; font-weight: bold;">${url}</a>`;
            }
        });
    }

    socket.on('connect', () => {
        statusContainer.innerHTML = '🟢 Live Chat Συνδέθηκε!'; statusContainer.style.color = '#2ecc71';
        messageInput.disabled = false; sendButton.disabled = false;
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) { voiceButton.disabled = false; setupVoiceRecording(); }
    });
        // 📊 Live Ακρόαση με αυτόματο ήχο εισόδου θεατή!
    let lastUserCount = 0; // Κρατάει τον προηγούμενο αριθμό

    socket.on('user-count', (count) => {
        const counterEl = document.getElementById('user-counter');
        if (counterEl) {
            counterEl.innerText = `Online: ${count}`;
        }
        
        // 🔥 ΚΛΕΙΔΙ: Αν ο αριθμός των χρηστών αυξήθηκε, παίξε τον ήχο εισόδου!
        if (count > lastUserCount && lastUserCount !== 0) {
            soundJoin.play().catch(e => console.log('Ήχος εισόδου'));
        }
        
        lastUserCount = count; // Ενημέρωση του αριθμού για την επόμενη φορά
    });

    function setupVoiceRecording() {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            mediaStream = stream; mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm' }); audioChunks = [];
                const reader = new FileReader(); reader.readAsDataURL(audioBlob);
                reader.onloadend = () => socket.emit('send-message', { isVoice: true, messageId: 'msg_'+Math.random().toString(36).substr(2,9), name: usernameInput.value.trim()||'Επισκέπτης', message: reader.result, color: userColor, userId: myUserId });
            };
        }).catch(err => console.log(err));

        voiceButton.addEventListener('mousedown', () => { if(mediaRecorder && mediaRecorder.state==='inactive') { audioChunks=[]; mediaRecorder.start(); voiceButton.style.background='#f1c40f'; } });
        window.addEventListener('mouseup', () => { if(mediaRecorder && mediaRecorder.state==='recording') { mediaRecorder.stop(); voiceButton.style.background='#c0392b'; } });
        voiceButton.addEventListener('touchstart', (e) => { e.preventDefault(); audioChunks=[]; mediaRecorder.start(); voiceButton.style.background='#f1c40f'; });
        voiceButton.addEventListener('touchend', () => { if(mediaRecorder && mediaRecorder.state==='recording') { mediaRecorder.stop(); voiceButton.style.background='#c0392b'; } });
    }

    socket.on('receive-message', (data) => {
        if (data.type === 'delete-message') { const el = document.getElementById(data.messageId); if(el) el.remove(); return; }
        if (document.getElementById(data.messageId)) return;
        const msgEl = document.createElement('div'); msgEl.id = data.messageId; msgEl.style.marginBottom = '8px';
        let delBtn = isAdmin ? `<button style="background:#c0392b;color:white;height:20px;padding:0 5px;margin-right:5px;" onclick="socket.emit('send-message',{type:'delete-message',messageId:'${data.messageId}'})">X</button>` : '';
        
        if (data.isVoice) { 
            msgEl.innerHTML = `${delBtn}<strong style="color:${data.color || '#00ffcc'};">${data.name}:</strong><audio controls style="max-width:180px;height:30px;display:block;" src="${data.message}"></audio>`; 
                } else { 
            // 🔥 ΚΛΕΙΔΙ: Προσθέτουμε font-style: italic; για πλάγια, καλλιγραφική γραφή στο μήνυμα!
            msgEl.innerHTML = `${delBtn}<strong style="color:${data.color || '#00ffcc'};">${data.name}:</strong> <span style="color: #ffff00; font-style: italic;">${linkify(data.message)}</span>`; 
        }

        messagesContainer.appendChild(msgEl); messagesContainer.scrollTop = messagesContainer.scrollHeight;
        if(data.userId !== myUserId) soundReceive.play().catch(e=>'');
    });

    function sendMessage() {
        const text = messageInput.value.trim(); 
        if (text === '') return;

        soundSend.play().catch(e => console.log('Ήχος'));

        socket.emit('send-message', { 
            messageId: 'msg_' + Math.random().toString(36).substr(2, 9), 
            name: usernameInput.value.trim() || 'Επισκέπτης', 
            message: text, 
            color: userColor, 
            userId: myUserId 
        });
        messageInput.value = '';
    }

    sendButton.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
